<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Parsa Attaran - Computer Engineering and Software Systems</title>
  <desc id="desc">A dark geometric banner introducing Parsa Attaran and his focus on backend systems, client-server applications, and automation.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#0d1727"/>
      <stop offset="1" stop-color="#111d2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="name-typing-clip">
      <rect class="name-reveal" x="70" y="88" width="326" height="64"/>
    </clipPath>
    <style>
      .name-reveal {
        animation: type-name 6s steps(13, end) infinite;
      }
      .name-cursor {
        animation:
          move-cursor 6s steps(13, end) infinite,
          blink-cursor .75s step-end infinite;
      }
      @keyframes type-name {
        0%, 8% { width: 0; }
        42%, 88% { width: 326px; }
        94%, 100% { width: 0; }
      }
      @keyframes move-cursor {
        0%, 8% { transform: translateX(0); }
        42%, 88% { transform: translateX(326px); }
        94%, 100% { transform: translateX(0); }
      }
      @keyframes blink-cursor {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#background)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <path d="M0 274C238 223 420 312 667 262S1017 191 1200 239V320H0Z" fill="#0b1422" opacity=".78"/>
  <circle cx="978" cy="145" r="128" fill="#0ea5e9" opacity=".07" filter="url(#glow)"/>

  <g>
    <rect x="790" y="56" width="338" height="202" rx="12" fill="#07101c" stroke="#26364b" stroke-width="1.5"/>
    <path d="M790 90H1128" stroke="#26364b" stroke-width="1.5"/>
    <circle cx="814" cy="73" r="5" fill="#fb7185"/>
    <circle cx="833" cy="73" r="5" fill="#fbbf24"/>
    <circle cx="852" cy="73" r="5" fill="#34d399"/>
    <text x="1102" y="78" fill="#475569" font-family="Consolas, monospace" font-size="11" text-anchor="end">profile.sh</text>

    <g font-family="Consolas, monospace" font-size="14">
      <text x="816" y="120" fill="#22d3ee">$</text>
      <text x="836" y="120" fill="#94a3b8">whoami</text>
      <text x="816" y="146" fill="#e2e8f0">computer engineering @ SBU</text>
      <text x="816" y="178" fill="#22d3ee">$</text>
      <text x="836" y="178" fill="#94a3b8">focus --current</text>
      <text x="816" y="204" fill="#e2e8f0">backend / automation / systems</text>
      <text x="816" y="234" fill="#34d399">ready to build_</text>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="72" y="68" fill="#67e8f9" font-size="13" font-weight="700" letter-spacing="2.8">COMPUTER ENGINEERING / SOFTWARE SYSTEMS</text>
    <text x="70" y="137" fill="#f8fafc" font-size="54" font-weight="750" letter-spacing="-1.5" clip-path="url(#name-typing-clip)">Parsa Attaran</text>
    <rect class="name-cursor" x="70" y="94" width="3" height="50" rx="1.5" fill="#67e8f9"/>
    <rect x="72" y="159" width="68" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="202" fill="#cbd5e1" font-size="21" font-weight="450">Turning workflows into software,</text>
    <text x="72" y="231" fill="#cbd5e1" font-size="21" font-weight="450">and software into systems.</text>

    <g font-size="11" font-weight="700" letter-spacing="1.2">
      <rect x="72" y="258" width="152" height="28" rx="14" fill="#0e2637" stroke="#164e63"/>
      <text x="148" y="276" fill="#67e8f9" text-anchor="middle">BACKEND SYSTEMS</text>
      <rect x="236" y="258" width="128" height="28" rx="14" fill="#0e2637" stroke="#164e63"/>
      <text x="300" y="276" fill="#67e8f9" text-anchor="middle">AUTOMATION</text>
      <rect x="376" y="258" width="172" height="28" rx="14" fill="#0e2637" stroke="#164e63"/>
      <text x="462" y="276" fill="#67e8f9" text-anchor="middle">CLIENT-SERVER</text>
    </g>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="318.5" rx="17.25" fill="none" stroke="#334155" stroke-width="1.5"/>
</svg>
