<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="title desc"><title id="title">Learn Linux</title><desc id="desc">Persian Linux command-line guide covering files, permissions, processes, streams, grep, regex, and globbing.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081612"/><stop offset="1" stop-color="#10251d"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect width="900" height="210" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="898" height="208" rx="17" fill="none" stroke="#24483c" stroke-width="2"/><rect width="7" height="210" rx="3.5" fill="url(#accent)"/><g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="38" y="42" fill="#6ee7b7" font-size="12" font-weight="700" letter-spacing="2.4">04 / SYSTEMS &amp; TECHNICAL WRITING</text><text x="38" y="82" fill="#f8fafc" font-size="29" font-weight="750">Learn Linux</text><text x="38" y="113" fill="#98aaa3" font-size="15">A practical Persian guide to the command line and Unix concepts.</text><g font-size="12" font-weight="650"><rect x="38" y="139" width="62" height="28" rx="14" fill="#10291f" stroke="#1d6b50"/><text x="69" y="157" fill="#d1fae5" text-anchor="middle">Linux</text><rect x="110" y="139" width="57" height="28" rx="14" fill="#10291f" stroke="#1d6b50"/><text x="138.5" y="157" fill="#d1fae5" text-anchor="middle">Shell</text><rect x="177" y="139" width="68" height="28" rx="14" fill="#10291f" stroke="#1d6b50"/><text x="211" y="157" fill="#d1fae5" text-anchor="middle">Regex</text><rect x="255" y="139" width="128" height="28" rx="14" fill="#10291f" stroke="#1d6b50"/><text x="319" y="157" fill="#d1fae5" text-anchor="middle">Persian docs</text></g></g><g transform="translate(645 35)"><rect width="205" height="140" rx="12" fill="#06110d" stroke="#27604b" stroke-width="2"/><path d="M0 31h205" stroke="#27604b" stroke-width="2"/><circle cx="17" cy="16" r="4" fill="#fb7185"/><circle cx="31" cy="16" r="4" fill="#fbbf24"/><circle cx="45" cy="16" r="4" fill="#34d399"/><g font-family="Consolas, monospace" font-size="13"><text x="17" y="58" fill="#34d399">$</text><text x="35" y="58" fill="#d1fae5">grep -R "learn" .</text><text x="17" y="83" fill="#34d399">$</text><text x="35" y="83" fill="#d1fae5">chmod +x explore.sh</text><text x="17" y="108" fill="#34d399">$</text><text x="35" y="108" fill="#d1fae5">./explore.sh</text><text x="17" y="130" fill="#67e8f9">knowledge loading...</text></g></g></svg>
