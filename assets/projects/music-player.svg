<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="title desc"><title id="title">Music Player</title><desc id="desc">Collaborative Flutter and Java music application built around a custom socket protocol.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111021"/><stop offset="1" stop-color="#201530"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs><rect width="900" height="210" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="898" height="208" rx="17" fill="none" stroke="#493654" stroke-width="2"/><rect width="7" height="210" rx="3.5" fill="url(#accent)"/><g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="38" y="42" fill="#d8b4fe" font-size="12" font-weight="700" letter-spacing="2.4">02 / CLIENT-SERVER SYSTEM</text><text x="38" y="82" fill="#f8fafc" font-size="29" font-weight="750">Music Player</text><text x="38" y="113" fill="#a8a1b8" font-size="15">Flutter client and multithreaded Java server over framed JSON.</text><g font-size="12" font-weight="650"><rect x="38" y="139" width="70" height="28" rx="14" fill="#24172f" stroke="#6d3b7f"/><text x="73" y="157" fill="#f5d0fe" text-anchor="middle">Flutter</text><rect x="118" y="139" width="55" height="28" rx="14" fill="#24172f" stroke="#6d3b7f"/><text x="145.5" y="157" fill="#f5d0fe" text-anchor="middle">Dart</text><rect x="183" y="139" width="58" height="28" rx="14" fill="#24172f" stroke="#6d3b7f"/><text x="212" y="157" fill="#f5d0fe" text-anchor="middle">Java</text><rect x="251" y="139" width="104" height="28" rx="14" fill="#24172f" stroke="#6d3b7f"/><text x="303" y="157" fill="#f5d0fe" text-anchor="middle">TCP sockets</text><rect x="365" y="139" width="58" height="28" rx="14" fill="#24172f" stroke="#6d3b7f"/><text x="394" y="157" fill="#f5d0fe" text-anchor="middle">JSON</text